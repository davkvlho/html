<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Bake My Day - Cadastro</title>
</head>
<body>

    <header>
        <h1>Faça Parte do Nosso Universo! </h1>
    </header>

    <nav>
        <div class="lista">
        <ul style="list-style-type: none; padding: 0; margin: 0;">
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Nossos Cupcakes</a></li>
            <li><a href="cadastro.html">Cadastro / Contato</a></li>
            <li><a href="login.html">Área do Cliente</a></li>
            <li><a href="quemsomos.html">Quem Somos</a></li>
        </ul>
        </div>
    </nav>
    <br>

    <main>
        <section>
            <div class="container">
            <h2>Formulário Completo de Cadastro de Clientes & Parceiros</h2>

            <form action="index.html" method="post">
                
                <div>
                    <label for="txt-nome">Nome Completo:</label>
                    <input type="text" id="txt-nome" name="nome" minlength="5" required placeholder="Digite seu nome completo">
                </div>
                <br>

                <div>
                    <label for="txt-email">E-mail de Contato:</label>
                    <input type="email" id="txt-email" name="email" required placeholder="seuemail@exemplo.com">
                </div>
                <br>

                <div>
                    <label for="txt-tel">Telefone / Celular:</label>
                    <input type="tel" id="txt-tel" name="telefone" pattern="\(\d{2}\) \d{5}-\d{4}" title="Formato aceito: (XX) XXXXX-XXXX" placeholder="(11) 99999-9999">
                </div>
                <br>
                <div>
                    <label for="sel-estado">Selecione seu Estado:</label>
                    <select id="sel-estado" name="estado">
                        <option value="">-- Escolha uma opção --</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>
                <br>
                <div>
                    <button type="submit">Enviar Cadastro</button>
                    <br><br>
                    <button type="reset">Limpar Tudo</button>
                </div>

            </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bake My Day Cupcakes. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
